name: astrbot_plugin_social_graph
display_name: 记忆中心
short_desc: 让她记住每个聊过天的人：印象、关系、说过的话，可看可改
desc: |
  **记忆中心** —— 让机器人记住每个和它聊过天的人。

  私聊里聊得好好的，一进群就「你是谁」；群里某个人天天来，一周后还是陌生人。
  这个插件把聊天现场变成一张长期的人物关系网：

  - **被动收听**：记录私聊与群聊消息（只写库、不回话、不抢主链），身份按 QQ 号归一
  - **批量抽取**：攒够一批或闲置一段时间，用小模型把消息合并成「40~300 字的印象」与「谁和谁是什么关系」
  - **聊天时注入**：把印象、关系、最近言论贴进 system prompt **和**当前轮消息，避免长人设把它盖过去
  - **群聊插话**（可选）：没人 @ 时也有机会自己接一句，受概率、每日上限、冷却约束
  - **WebUI 面板**：四个标签页——人物 / 关系网 / 消息流 / 设置，可直接改印象、加删关系、调参数
  - **聊天命令**：`/画像`、`/关系`、`/整理`

  零外部依赖，数据全部存在本地 SQLite（`data/plugin_data/astrbot_plugin_social_graph/social.db`）。
  私聊时只会带上**群里**的事，不会把别人的私聊内容串出来。
help: |
  WebUI：插件页 →「记忆中心」，可看所有人的印象、关系网、消息流，也能直接改印象、加删关系、调参数。
  聊天命令：
  - /画像 看全部；/画像 昵称 看某人详细
  - /关系 看关系网
  - /整理 立刻把攒着的消息整理成印象
  - 私聊里提到群里某人时，会自动带上那个人的印象与他最近说过的话
